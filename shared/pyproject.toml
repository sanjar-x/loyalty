# =============================================================================
# shared — Foundation library: domain abstractions, shared kernel, exceptions.
#
# Cross-module primitives that every bounded context relies on but no
# context owns: ``IUnitOfWork``, ``ILogger``, ``IClock``,
# ``IPermissionResolver``, the ``CamelModel`` / ``MoneySchema`` Pydantic
# bases, the exception hierarchy that maps onto the API error envelope,
# the ``Ledger`` event-sourcing kernel, pagination primitives, etc.
#
# Workspace member (see ../pyproject.toml). Imported as ``shared.*`` by
# ``backend`` (which transitively makes it available to every app); not
# directly depended on by ``apps/*`` since they reach the shared kernel
# through ``backend``'s ``src.*`` reexports.
#
# ADR-008 Phase 2: promoted out of ``apps/backend/src/shared/`` so its
# evolution (and lockfile churn) is independent from the rest of the
# backend tree.
# =============================================================================

[project]
name = "shared"
version = "0.1.0"
description = "Loyalty shared kernel — cross-module domain abstractions, exceptions, schemas, ledger."
requires-python = ">=3.14"
dependencies = [
    # Pydantic powers CamelModel + MoneySchema in shared.schemas.
    "pydantic>=2.10",
    # attrs is used by AggregateRoot / value-object base classes.
    "attrs>=25.4.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
