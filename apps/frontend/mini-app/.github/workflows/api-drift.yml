name: API drift guard

# Backend `openapi.json` o'zgarsa, frontend codegen artefaktlari ham o'zgarishi
# kerak. Aks holda RTKQ endpoint'lari va TS tiplari eskirgan bo'ladi va
# silently 404/422 chiqaradi. Bu workflow har PR/push'da:
#  1. Hozirgi commit'dagi `openapi.json` ustidan codegen ishga tushiradi
#  2. `lib/store/__generated__` ostida `git diff --exit-code` qiladi
#  3. Tipcheck + testlarni ishga tushiradi
#
# Drift bo'lsa CI qizaradi va PR author'i `npm run api:gen && npm run api:types`
# ishga tushirib, natijani commit qilishi kerak.

on:
  pull_request:
    branches: [main]
    paths:
      - 'openapi.json'
      - 'lib/store/**'
      - 'openapi.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api-drift.yml'
  push:
    branches: [main]

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # `24` — `.npmrc engine-strict=true` + `engines.node >=24` talabi
          # (eski '20' `npm ci` bosqichida qizarardi). Admin `ci.yml` bilan paritet.
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Regenerate codegen
        run: |
          npm run api:gen
          npm run api:types

      - name: Verify no drift
        run: |
          if ! git diff --exit-code lib/store/__generated__; then
            echo ""
            echo "::error::Codegen drift detected. Run 'npm run api:gen && npm run api:types' locally and commit the changes."
            exit 1
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test
