# =============================================================================
# apps/scheduler — TaskIQ scheduler (cron triggers).
#
# Runs exactly ONE instance per deployment — multiple schedulers would
# duplicate every scheduled kick. See ``src.bootstrap.scheduler`` for the
# canonical assembly. This app is a thin re-export.
# =============================================================================

[project]
name = "loyality-scheduler"
version = "0.1.0"
description = "TaskIQ scheduler — periodic cron triggers (outbox prune, image cleanup, etc)."
requires-python = ">=3.14"
dependencies = [
    "loyality",
]

[tool.uv.sources]
loyality = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loyality_scheduler"]
