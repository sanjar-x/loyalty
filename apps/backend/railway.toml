# Railway service config — apps/backend (FastAPI web).
#
# Backend is the canonical migration-running service (cross-service
# policy inherited from REC-005 + HARD-1): only the web service applies
# ``alembic upgrade head``; workers and the scheduler skip to avoid
# concurrent migration-lock contention during the parallel deploy fan-out.
# Alembic config lives in ``apps/backend/alembic.ini``.
# Railway service is configured with Root Directory = ``apps/backend``,
# so paths here are relative to that directory.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Backend's image uses ``WORKDIR /app`` (single self-contained layout).
# ``startCommand`` lives here instead of the Dockerfile so the same image
# can power multiple Railway services with different roles. This file
# configures the backend / web service (uvicorn). The core-worker
# service shares this image and overrides startCommand via the Railway
# UI to ``python -m taskiq worker src.bootstrap.worker_core:broker``.
startCommand = "python -m uvicorn main:app --host 0.0.0.0 --port 8080"
preDeployCommand = ["sh -c 'cd /app && uv run alembic upgrade head'"]
