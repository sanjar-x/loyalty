# =============================================================================
# apps/workers/scheduler — TaskIQ scheduler (cron triggers).
#
# Runs exactly ONE instance per deployment — multiple schedulers would
# duplicate every scheduled kick. Lives under ``apps/workers/`` because it
# shares the broker setup with the other workers and dispatches the cron
# kicks they consume.
# =============================================================================

[project]
name = "scheduler-worker"
version = "0.1.0"
description = "TaskIQ scheduler — periodic cron triggers (outbox prune, image cleanup, etc)."
requires-python = ">=3.14"
dependencies = [
    "backend",
]

[tool.uv.sources]
backend = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduler_worker"]
