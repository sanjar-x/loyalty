# =============================================================================
# apps/workers/scheduler — TaskIQ scheduler (cron triggers).
#
# Virtual workspace project (``[tool.uv] package = false``). Run exactly
# ONE replica per deployment — multiple schedulers would duplicate every
# scheduled kick.
#
#     cd apps/workers/scheduler && taskiq scheduler main:scheduler
# =============================================================================

[project]
name = "scheduler-worker"
version = "0.1.0"
description = "TaskIQ scheduler — periodic cron triggers (outbox prune, image cleanup, etc)."
requires-python = ">=3.14"
dependencies = [
    "backend",
]

[tool.uv]
package = false

[tool.uv.sources]
# Path-based reference (was ``workspace = true`` before the standalone
# refactor took backend out of the root uv workspace).
# ``apps/workers/scheduler`` → ``../../backend`` is ``apps/backend``.
# Editable so changes to backend's src/ show up without re-installing.
backend = { path = "../../backend", editable = true }
