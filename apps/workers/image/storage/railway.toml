# Railway service config — apps/workers/image/storage.
#
# Railway service is configured with Root Directory =
# ``apps/workers/image/storage``, so paths here are relative to that
# directory.
#
# Workers skip migrations (REC-005 + HARD-1). Lean image — no model
# cache volume needed; no ML inference.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m taskiq worker main:broker"
