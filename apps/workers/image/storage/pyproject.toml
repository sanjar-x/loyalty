# =============================================================================
# apps/workers/image/storage — fully independent image-processing worker.
#
# Virtual workspace project (``[tool.uv] package = false``). NO
# dependency on ``backend`` — coordination with the rest of the
# platform is via three external surfaces:
#
#   * PostgreSQL (storage_objects + outbox_messages tables, schema
#     owned by backend's alembic migrations)
#   * Redis Streams (channel ``media:status:{uuid}``, JSON wire format)
#   * RabbitMQ (queue ``image_storage_jobs`` with routing-key bindings
#     ``image.storage.process`` + ``image.storage.cleanup_orphans``,
#     task names ``process_image`` + ``image_cleanup_orphans``)
#
# No Python import crosses the boundary. Schema drift between this
# worker and backend is caught at runtime by the raw-SQL UPDATE — there
# is no shared ORM model to compile.
#
# Run command:
#
#     cd apps/workers/image/storage && python -m taskiq worker main:broker
# =============================================================================

[project]
name = "image-storage-worker"
version = "0.1.0"
description = "Image-storage TaskIQ worker — Pillow resize + S3, fully standalone."
requires-python = ">=3.14"
dependencies = [
    "aiobotocore>=3.3.0",
    "asyncpg>=0.31.0",
    "pillow>=11.0.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis[hiredis]>=7.3.0",
    "sqlalchemy[asyncio]>=2.1.0b1",
    "structlog>=25.5.0",
    "taskiq>=0.12.1",
    "taskiq-aio-pika>=0.6.0",
    "types-aiobotocore-s3>=2.18",
]

[tool.uv]
package = false
