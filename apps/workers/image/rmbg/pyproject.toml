# =============================================================================
# apps/workers/image/rmbg — TaskIQ worker dedicated to Bria RMBG-2.0
# background removal (the ``image.ml`` queue).
#
# Virtual workspace project (``[tool.uv] package = false``). Run from
# inside the app dir:
#
#     cd apps/workers/image/rmbg && python -m taskiq worker main:broker
#
# This is the ONLY workspace member that pulls in the ML stack
# (torch + transformers + timm + kornia, ~2.5 GB resolved). The lean
# ``apps/workers/image/storage`` worker handles Pillow resize + S3
# uploads without these dependencies.
#
# Torch CPU wheel is pinned via the ``pytorch-cpu`` index defined at the
# workspace root; the ``[tool.uv.sources]`` below redirects torch /
# torchvision to it so we never resolve the multi-GB CUDA build on
# Railway's GPU-less nodes (REC-024 lesson).
#
# Status publishing is owned by this worker (no dependency on backend's
# image-domain ``SSEManager``): the local ``publisher.py`` calls
# ``XADD media:status:{uuid}`` directly on the Redis client injected
# from the workspace cache provider.
# =============================================================================

[project]
name = "image-rmbg-worker"
version = "0.1.0"
description = "TaskIQ worker — Bria RMBG-2.0 background removal (ML inference, image.ml queue)."
requires-python = ">=3.14"
dependencies = [
    "backend",
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "timm>=0.9.0",
    "kornia>=0.7.0",
]

[tool.uv]
package = false

[tool.uv.sources]
backend = { workspace = true }
torch = [{ index = "pytorch-cpu", marker = "platform_system == 'Linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "platform_system == 'Linux'" }]
