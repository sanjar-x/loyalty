# =============================================================================
# apps/workers/core — TaskIQ worker for non-image domain queues.
#
# Subscribes to orders / payments / logistics / outbox / cron queues — every
# domain except the image module's processing + ML queues, which live in
# ``apps/workers/image/storage`` and ``apps/workers/image/rmbg``.
#
# Workspace member (see ../../../pyproject.toml). ``uv sync --package
# core-worker`` installs only the backend graph — NO torch / transformers
# / timm / kornia, because those live in ``apps/workers/image/rmbg``'s
# ``[project.dependencies]`` and are not in this app's transitive closure.
# =============================================================================

[project]
name = "core-worker"
version = "0.1.0"
description = "TaskIQ worker — non-image domain queues (orders, payments, logistics, outbox, cron)."
requires-python = ">=3.14"
dependencies = [
    "backend",
]

[tool.uv.sources]
backend = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_worker"]
