# =============================================================================
# apps/workers/core — TaskIQ worker for non-image domain queues.
#
# Virtual workspace project (``[tool.uv] package = false``): uv resolves
# this app's dependencies into the shared lockfile but does NOT install
# the app itself as a Python package. Entry point is ``main.py`` next to
# this file; run from inside the app directory:
#
#     cd apps/workers/core && taskiq worker main:broker
#
# Build isolation — ``uv sync --package core-worker`` installs ONLY the
# backend graph (no torch / transformers / timm / kornia, those live in
# ``apps/workers/image/rmbg``).
# =============================================================================

[project]
name = "core-worker"
version = "0.1.0"
description = "TaskIQ worker — non-image domain queues (orders, payments, logistics, outbox, cron)."
requires-python = ">=3.14"
dependencies = [
    "backend",
]

[tool.uv]
package = false

[tool.uv.sources]
backend = { workspace = true }
