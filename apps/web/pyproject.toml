# =============================================================================
# apps/web — FastAPI HTTP service.
#
# Workspace member (see ../../pyproject.toml). Build-isolated from other
# apps: ``uv sync --package loyality-web`` installs only this graph.
#
# Runtime deps are inherited from the ``loyality`` workspace member
# (backend) — every module's presentation layer is already there. apps/web
# is a thin entry point that re-exports ``backend.main:app`` so Railway's
# Dockerfile + uvicorn invocation stay untouched.
# =============================================================================

[project]
name = "loyality-web"
version = "0.1.0"
description = "FastAPI HTTP service — mounts all module routers from backend."
requires-python = ">=3.14"
dependencies = [
    "loyality",
]

[tool.uv.sources]
loyality = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loyality_web"]
