# =============================================================================
# Loyalty — monorepo root.
#
# Three deployable artefacts each have their OWN ``uv.lock`` and Dockerfile
# that builds from their own directory (Railway Root Directory = that
# directory). They are independent of this root project:
#
#   * apps/backend                  — FastAPI HTTP + library code
#   * apps/workers/image/rmbg       — Bria RMBG-2.0 (torch ML stack)
#   * apps/workers/image/storage    — Pillow + S3 (no ML)
#
# The remaining workspace members below still depend on backend's Python
# code (``from src.bootstrap...``) — they consume backend via a local
# path dependency rather than a workspace reference, and their Dockerfiles
# still need the monorepo root as build context to see the backend tree.
#
#   * apps/bot                      — Telegram bot (Aiogram polling)
#   * apps/workers/scheduler        — TaskIQ scheduler (cron)
#
# ``apps/backend`` runs core-worker too (same Docker image, different
# start command); not a separate workspace member.
#
# See ADR-008 (Multi-Package Modular Monorepo) for context.
# =============================================================================

[project]
name = "loyality-workspace"
version = "0.1.0"
description = "Loyalty marketplace monorepo root — workspace for apps that share backend code (bot, scheduler). The three standalone artefacts (backend, image-rmbg, image-storage) own their own lockfiles."
requires-python = ">=3.14"

[tool.uv.workspace]
members = [
    "apps/bot",
    "apps/workers/scheduler",
]

# ----------------------------------------------------------------------------
# Torch CPU pin — kept here for any future workspace member that pulls
# torch. The standalone ``apps/workers/image/rmbg`` declares the same
# index in its own ``pyproject.toml`` since it no longer shares this one.
# ----------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
