version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend/admin
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - dependencies
      - frontend-admin
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint*'
          - 'eslint-*'
          - '@typescript-eslint/*'
      prettier:
        patterns:
          - 'prettier'
          - 'prettier-*'
          - '@prettier/*'
      stylelint:
        patterns:
          - 'stylelint'
          - 'stylelint-*'
      tanstack:
        patterns:
          - '@tanstack/*'
      next:
        patterns:
          - 'next'
          - 'eslint-config-next'
          - '@next/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'prettier-plugin-tailwindcss'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
          - 'jsdom'
      husky:
        patterns:
          - 'husky'
          - 'lint-staged'
          - '@commitlint/*'
      types:
        patterns:
          - '@types/*'
        exclude-patterns:
          - '@types/react'
          - '@types/react-dom'
    ignore:
      # Major-version upgrades are too risky for unattended Dependabot PRs;
      # bump them manually after reading the changelog.
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
