# Pre-commit stage (auto on `git commit`):
#   uv run --project backend pre-commit install
#
# Pre-push stage (REC-019 — auto on `git push`):
#   uv run --project backend pre-commit install --hook-type pre-push
#
# Or both at once (preferred — see Makefile target `precommit-install`):
#   uv run --project backend pre-commit install --hook-type pre-commit --hook-type pre-push
#
# Manual sweeps:
#   uv run pre-commit run --all-files
#   uv run pre-commit run --hook-stage pre-push --all-files
fail_fast: false

repos:
  - repo: local
    hooks:
      # ----------------------------------------------------------------
      # commit-stage hooks (run on every `git commit`)
      # ----------------------------------------------------------------

      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --project backend ruff check --fix
        language: system
        types_or: [python, pyi]
        files: ^backend/
        exclude: ^backend/\.claude/
        pass_filenames: true

      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --project backend ruff format
        language: system
        types_or: [python, pyi]
        files: ^backend/
        exclude: ^backend/\.claude/
        pass_filenames: true

      - id: ty-check
        name: ty check (backend)
        # ty operates project-wide via its own config; ignore filenames
        # so a single invocation per commit covers the whole tree.
        entry: bash -c 'cd backend && uv run ty check'
        language: system
        types_or: [python, pyi]
        files: ^backend/
        pass_filenames: false

      # ----------------------------------------------------------------
      # pre-push stage (REC-019 — run on every `git push`)
      #
      # Replaces the GHA-based REC-015 baseline with always-faster, free,
      # client-side enforcement (see CEO directive #2 — "no paid
      # services"). The REC-015 GHA workflow file is kept as the
      # documented target state if/when paid CI is authorised.
      # ----------------------------------------------------------------

      - id: backend-production-smoke
        name: backend production smoke (uv sync --no-dev --frozen + create_app + broker)
        # Delegates to `make production-smoke` so the trap that restores
        # the dev venv on exit lives in one place and is reusable from
        # the developer's shell (`cd backend && make production-smoke`).
        entry: bash -c 'cd backend && make production-smoke'
        stages: [pre-push]
        pass_filenames: false
        language: system

      - id: backend-tests-unit
        # PC-201c resolved (Sprint 3, D0.2) — the previous 9 failures
        # all stemmed from one stub mismatch (``_CardStub.product_id``
        # vs ``StorefrontProductCardReadModel.id``). Stub fixed in
        # ``tests/unit/activity/test_for_you_feed.py`` and the
        # ``--ignore`` flag dropped here. The full unit suite gates
        # every push from now on.
        name: backend unit tests
        entry: bash -c 'cd backend && uv run pytest tests/unit/ -x -q --no-cov'
        stages: [pre-push]
        pass_filenames: false
        language: system

      - id: backend-tests-architecture
        name: backend architecture fitness tests
        entry: bash -c 'cd backend && uv run pytest tests/architecture/ -x -q --no-cov'
        stages: [pre-push]
        pass_filenames: false
        language: system
