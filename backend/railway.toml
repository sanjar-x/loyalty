[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# HARD-1 — canonical migration timing. Runs once per deploy, in a fresh
# container, BEFORE the new instance takes traffic. Failure aborts the
# deploy and leaves the previous revision serving.
#
# Cross-service policy (mirrors REC-005 audit): only the `web` service
# applies migrations. `worker` and `scheduler` skip to avoid concurrent
# migration locks during the parallel deploy fan-out. Default value is
# `web` so an unset SERVICE_MODE behaves like the historical entrypoint.
#
# Migration ordering caveat (REC-022 backlog): Railway parallelises web /
# worker / scheduler deploys. Backward-incompatible migrations (drop
# column / rename table) require expand-deploy-contract sequencing across
# separate PRs, OR manual per-service deploy ordering via the Railway
# dashboard. See REC-022 for the migration-ordering convention doc.
[deploy]
# Railway docs (https://docs.railway.com/config-as-code/reference) define
# preDeployCommand as `array of strings`. The single sh -c entry below is
# wrapped in a one-element array because Railway's parser rejects a bare
# string. Multiple array entries are valid and would run sequentially;
# the conditional logic below is one shell invocation, so one array
# element is enough.
preDeployCommand = [
    "sh -c 'if [ \"${SERVICE_MODE:-web}\" = \"web\" ]; then alembic upgrade head; else echo \"[preDeploy] skip (mode=${SERVICE_MODE})\"; fi'",
]
